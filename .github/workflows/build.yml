name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle Wrapper
        working-directory: RecipeApp
        run: gradle wrapper

      - name: Make gradlew executable
        working-directory: RecipeApp
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: RecipeApp
        run: ./gradlew assembleDebug --no-daemon

      # 1. 暴力搜索整个项目里的 apk 文件，并把它们的路径打印在日志里
      - name: Print all APK paths
        run: |
          echo "====== 正在搜索所有的 APK 文件 ======"
          find . -name "*.apk" || echo "没有找到任何 apk"
          echo "====== 搜索结束 ======"

      # 2. 尝试上传标准的 APK（如果存在）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: RecipeApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore  # 找不到也不报错，让流程走完

      # 3. 终极兜底：把整个 debug 构建目录全部打包上传（如果里面有 APK，这里一定找得到）
      - name: Upload entire debug folder as fallback
        uses: actions/upload-artifact@v4
        with:
          name: entire-debug-folder
          path: RecipeApp/app/build/outputs/apk/debug/
          if-no-files-found: ignore
