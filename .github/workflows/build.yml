name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # 【重要】升级到 v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6 # 【重要】替换为新的 Action

      - name: Check uploaded files
        run: |
          echo "当前仓库根目录："
          ls -la
          echo "RecipeApp 目录下的文件："
          ls -la RecipeApp/

      - name: Generate Gradle Wrapper
        working-directory: RecipeApp
        run: gradle wrapper

      - name: Make gradlew executable
        working-directory: RecipeApp # 【重要】添加工作目录
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: RecipeApp
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: RecipeApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
